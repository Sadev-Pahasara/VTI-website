<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Approval</title>
  <link rel="stylesheet" href="student-approval.css">
</head>
<body>
  <div class="container">
    <h1>Student Approval</h1>

    <h2>Pending Students</h2>
    <table id="pendingTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Program</th>
          <th>Faculty</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Pending students will load here -->
      </tbody>
    </table>

    <h2>Approved Students</h2>
    <table id="approvedTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Program</th>
          <th>Faculty</th>
        </tr>
      </thead>
      <tbody>
        <!-- Approved students go here -->
      </tbody>
    </table>
  </div>

  <script src="student-approval.js"></script>
</body>
</html>
