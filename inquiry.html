<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Inquiry Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f9f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
            color: white;
            padding: 25px 0;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
            margin-bottom: 30px;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .admin-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #81c784;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
        }
        
        .stat-icon.pending {
            background-color: #ff9800;
        }
        
        .stat-icon.replied {
            background-color: #2196f3;
        }
        
        .stat-icon.resolved {
            background-color: #4caf50;
        }
        
        .stat-icon.total {
            background-color: #9c27b0;
        }
        
        .stat-info h3 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #2e7d32;
        }
        
        .stat-info p {
            color: #666;
            font-weight: 500;
        }
        
        .admin-controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-box {
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 300px;
            font-size: 1rem;
            transition: border 0.3s ease;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }
        
        .filter-group {
            display: flex;
            gap: 15px;
        }
        
        .filter-select {
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.4);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        th, td {
            padding: 18px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background-color: #e8f5e9;
            font-weight: 600;
            color: #2e7d32;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background-color: #f1f8e9;
        }
        
        .status {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            text-align: center;
            min-width: 100px;
        }
        
        .status.pending {
            background-color: #fff3e0;
            color: #ef6c00;
        }
        
        .status.replied {
            background-color: #e3f2fd;
            color: #1565c0;
        }
        
        .status.resolved {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .action-btns {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .action-btn.reply {
            background-color: #2196f3;
            color: white;
        }
        
        .action-btn.resolve {
            background-color: #4caf50;
            color: white;
        }
        
        .action-btn.delete {
            background-color: #f44336;
            color: white;
        }
        
        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .message-preview {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            gap: 10px;
        }
        
        .page-btn {
            padding: 10px 15px;
            border: 1px solid #ddd;
            background-color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .page-btn.active {
            background-color: #4caf50;
            color: white;
            border-color: #4caf50;
        }
        
        .page-btn:hover:not(.active) {
            background-color: #f1f1f1;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-data i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #bdbdbd;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: none;
        }
        
        .notification.success {
            background-color: #4caf50;
        }
        
        .notification.error {
            background-color: #f44336;
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .admin-controls {
                flex-direction: column;
            }
            
            .search-box {
                width: 100%;
            }
            
            .filter-group {
                width: 100%;
                justify-content: space-between;
            }
            
            table {
                display: block;
                overflow-x: auto;
            }
            
            .action-btns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1><i class="ri-dashboard-line"></i> Inquiry Management Dashboard</h1>
                <div class="admin-info">
                    <div class="admin-avatar">AD</div>
                    <div>
                        <p>Admin User</p>
                        <p>Last login: Today, 10:30 AM</p>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-icon total">
                    <i class="ri-inbox-line"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalInquiries">0</h3>
                    <p>Total Inquiries</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon pending">
                    <i class="ri-time-line"></i>
                </div>
                <div class="stat-info">
                    <h3 id="pendingInquiries">0</h3>
                    <p>Pending Inquiries</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon replied">
                    <i class="ri-mail-send-line"></i>
                </div>
                <div class="stat-info">
                    <h3 id="repliedInquiries">0</h3>
                    <p>Replied Inquiries</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon resolved">
                    <i class="ri-checkbox-circle-line"></i>
                </div>
                <div class="stat-info">
                    <h3 id="resolvedInquiries">0</h3>
                    <p>Resolved Inquiries</p>
                </div>
            </div>
        </div>
        
        <div class="admin-controls">
            <input type="text" class="search-box" placeholder="Search inquiries by name, email or message...">
            <div class="filter-group">
                <select class="filter-select" id="statusFilter">
                    <option value="all">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="replied">Replied</option>
                    <option value="resolved">Resolved</option>
                </select>
                <select class="filter-select" id="dateFilter">
                    <option value="all">All Dates</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>
                <button class="refresh-btn" id="refreshBtn">
                    <i class="ri-refresh-line"></i> Refresh
                </button>
            </div>
        </div>
        
        <table id="inquiriesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Message</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
        
        <div class="pagination">
            <!-- Pagination will be populated by JavaScript -->
        </div>
    </div>
    
    <footer>
        <div class="container">
            <p>© 2023 Inquiry Management System. All rights reserved.</p>
        </div>
    </footer>
    
    <div class="notification" id="notification"></div>

<script>
    // Global variables
    let inquiries = [];
    const itemsPerPage = 10;
    let currentPage = 1;
    
    // Initialize the dashboard
    document.addEventListener('DOMContentLoaded', function() {
        loadInquiriesFromAPI();
        
        // Set up event listeners
        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadInquiriesFromAPI();
            showNotification('Data refreshed successfully', 'success');
        });
        
        document.querySelector('.search-box').addEventListener('input', filterInquiries);
        document.getElementById('statusFilter').addEventListener('change', filterInquiries);
        document.getElementById('dateFilter').addEventListener('change', filterInquiries);
    });
    
    // Load inquiries from PHP API
    async function loadInquiriesFromAPI() {
        try {
            const response = await fetch('inquiry.php');
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            inquiries = await response.json();
            loadInquiries();
            updateStats();
        } catch (error) {
            console.error('Error fetching inquiries:', error);
            showNotification('Error loading inquiries: ' + error.message, 'error');
        }
    }
    
    // Load inquiries into the table
    function loadInquiries() {
        const tableBody = document.querySelector('#inquiriesTable tbody');
        tableBody.innerHTML = '';
        
        if (inquiries.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7">
                        <div class="no-data">
                            <i class="ri-inbox-line"></i>
                            <h3>No inquiries found</h3>
                            <p>There are no inquiries to display at the moment.</p>
                        </div>
                    </td>
                </tr>
            `;
            return;
        }
        
        // Calculate pagination
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedInquiries = inquiries.slice(startIndex, endIndex);
        
        paginatedInquiries.forEach(inquiry => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${inquiry.id}</td>
                <td>${inquiry.name}</td>
                <td>${inquiry.email}</td>
                <td class="message-preview" title="${inquiry.message}">${inquiry.message}</td>
                <td>${formatDate(inquiry.date)}</td>
                <td><span class="status ${inquiry.status}">${inquiry.status.charAt(0).toUpperCase() + inquiry.status.slice(1)}</span></td>
                <td>
                    <div class="action-btns">
                        <button class="action-btn reply" data-id="${inquiry.id}">
                            <i class="ri-mail-send-line"></i> Reply
                        </button>
                        <button class="action-btn resolve" data-id="${inquiry.id}">
                            <i class="ri-checkbox-circle-line"></i> Resolve
                        </button>
                        <button class="action-btn delete" data-id="${inquiry.id}">
                            <i class="ri-delete-bin-line"></i> Delete
                        </button>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);
        });
        
        // Add event listeners to action buttons
        document.querySelectorAll('.action-btn.reply').forEach(btn => {
            btn.addEventListener('click', () => updateStatus(btn.getAttribute('data-id'), 'replied'));
        });
        
        document.querySelectorAll('.action-btn.resolve').forEach(btn => {
            btn.addEventListener('click', () => updateStatus(btn.getAttribute('data-id'), 'resolved'));
        });
        
        document.querySelectorAll('.action-btn.delete').forEach(btn => {
            btn.addEventListener('click', () => deleteInquiry(btn.getAttribute('data-id')));
        });
        
        // Update pagination
        updatePagination();
    }
    
    // Update inquiry status
    async function updateStatus(id, status) {
        try {
            const response = await fetch('inquiry.php', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `id=${id}&status=${status}`
            });
            
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            
            const result = await response.json();
            
            if (result.message) {
                // Update local data
                const inquiryIndex = inquiries.findIndex(inq => inq.id == id);
                if (inquiryIndex !== -1) {
                    inquiries[inquiryIndex].status = status;
                    loadInquiries();
                    updateStats();
                    showNotification(`Inquiry #${id} marked as ${status}`, 'success');
                }
            } else if (result.error) {
                showNotification('Error: ' + result.error, 'error');
            }
        } catch (error) {
            console.error('Error updating status:', error);
            showNotification('Error updating status: ' + error.message, 'error');
        }
    }
    
    // Delete inquiry
    async function deleteInquiry(id) {
        if (confirm('Are you sure you want to delete this inquiry?')) {
            try {
                const response = await fetch('inquiry.php', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `id=${id}`
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const result = await response.json();
                
                if (result.message) {
                    // Remove from local data
                    inquiries = inquiries.filter(inq => inq.id != id);
                    loadInquiries();
                    updateStats();
                    showNotification(`Inquiry #${id} deleted successfully`, 'success');
                } else if (result.error) {
                    showNotification('Error: ' + result.error, 'error');
                }
            } catch (error) {
                console.error('Error deleting inquiry:', error);
                showNotification('Error deleting inquiry: ' + error.message, 'error');
            }
        }
    }
    
    // Filter inquiries based on search and filter criteria
    function filterInquiries() {
        const searchTerm = document.querySelector('.search-box').value.toLowerCase();
        const statusFilter = document.getElementById('statusFilter').value;
        const dateFilter = document.getElementById('dateFilter').value;
        
        let filteredInquiries = inquiries.filter(inquiry => {
            // Search filter
            const matchesSearch = 
                inquiry.name.toLowerCase().includes(searchTerm) ||
                inquiry.email.toLowerCase().includes(searchTerm) ||
                inquiry.message.toLowerCase().includes(searchTerm);
            
            // Status filter
            const matchesStatus = statusFilter === 'all' || inquiry.status === statusFilter;
            
            // Date filter
            let matchesDate = true;
            if (dateFilter !== 'all') {
                const inquiryDate = new Date(inquiry.date);
                const today = new Date();
                
                if (dateFilter === 'today') {
                    matchesDate = inquiryDate.toDateString() === today.toDateString();
                } else if (dateFilter === 'week') {
                    const weekAgo = new Date(today);
                    weekAgo.setDate(today.getDate() - 7);
                    matchesDate = inquiryDate >= weekAgo;
                } else if (dateFilter === 'month') {
                    const monthAgo = new Date(today);
                    monthAgo.setMonth(today.getMonth() - 1);
                    matchesDate = inquiryDate >= monthAgo;
                }
            }
            
            return matchesSearch && matchesStatus && matchesDate;
        });
        
        // Update table with filtered results
        const tableBody = document.querySelector('#inquiriesTable tbody');
        tableBody.innerHTML = '';
        
        if (filteredInquiries.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7">
                        <div class="no-data">
                            <i class="ri-search-line"></i>
                            <h3>No matching inquiries</h3>
                            <p>Try adjusting your search or filter criteria.</p>
                        </div>
                    </td>
                </tr>
            `;
            return;
        }
        
        // Apply pagination to filtered results
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedInquiries = filteredInquiries.slice(startIndex, endIndex);
        
        paginatedInquiries.forEach(inquiry => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${inquiry.id}</td>
                <td>${inquiry.name}</td>
                <td>${inquiry.email}</td>
                <td class="message-preview" title="${inquiry.message}">${inquiry.message}</td>
                <td>${formatDate(inquiry.date)}</td>
                <td><span class="status ${inquiry.status}">${inquiry.status.charAt(0).toUpperCase() + inquiry.status.slice(1)}</span></td>
                <td>
                    <div class="action-btns">
                        <button class="action-btn reply" data-id="${inquiry.id}">
                            <i class="ri-mail-send-line"></i> Reply
                        </button>
                        <button class="action-btn resolve" data-id="${inquiry.id}">
                            <i class="ri-checkbox-circle-line"></i> Resolve
                        </button>
                        <button class="action-btn delete" data-id="${inquiry.id}">
                            <i class="ri-delete-bin-line"></i> Delete
                        </button>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);
        });
        
        // Reattach event listeners to action buttons
        document.querySelectorAll('.action-btn.reply').forEach(btn => {
            btn.addEventListener('click', () => updateStatus(btn.getAttribute('data-id'), 'replied'));
        });
        
        document.querySelectorAll('.action-btn.resolve').forEach(btn => {
            btn.addEventListener('click', () => updateStatus(btn.getAttribute('data-id'), 'resolved'));
        });
        
        document.querySelectorAll('.action-btn.delete').forEach(btn => {
            btn.addEventListener('click', () => deleteInquiry(btn.getAttribute('data-id')));
        });
        
        // Update pagination for filtered results
        updatePagination(filteredInquiries.length);
    }
    
    // Update pagination
    function updatePagination(totalItems = inquiries.length) {
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        const paginationContainer = document.querySelector('.pagination');
        paginationContainer.innerHTML = '';
        
        if (totalPages <= 1) return;
        
        // Previous button
        const prevButton = document.createElement('button');
        prevButton.className = 'page-btn';
        prevButton.innerHTML = '<i class="ri-arrow-left-s-line"></i>';
        prevButton.disabled = currentPage === 1;
        prevButton.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                loadInquiries();
            }
        });
        paginationContainer.appendChild(prevButton);
        
        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
            const pageButton = document.createElement('button');
            pageButton.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            pageButton.textContent = i;
            pageButton.addEventListener('click', () => {
                currentPage = i;
                loadInquiries();
            });
            paginationContainer.appendChild(pageButton);
        }
        
        // Next button
        const nextButton = document.createElement('button');
        nextButton.className = 'page-btn';
        nextButton.innerHTML = '<i class="ri-arrow-right-s-line"></i>';
        nextButton.disabled = currentPage === totalPages;
        nextButton.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                loadInquiries();
            }
        });
        paginationContainer.appendChild(nextButton);
    }
    
    // Update statistics cards
    function updateStats() {
        const total = inquiries.length;
        const pending = inquiries.filter(inq => inq.status === 'pending').length;
        const replied = inquiries.filter(inq => inq.status === 'replied').length;
        const resolved = inquiries.filter(inq => inq.status === 'resolved').length;
        
        document.getElementById('totalInquiries').textContent = total;
        document.getElementById('pendingInquiries').textContent = pending;
        document.getElementById('repliedInquiries').textContent = replied;
        document.getElementById('resolvedInquiries').textContent = resolved;
    }
    
    // Format date for display
    function formatDate(dateString) {
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        return new Date(dateString).toLocaleDateString('en-US', options);
    }
    
    // Show notification
    function showNotification(message, type) {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.className = `notification ${type}`;
        notification.style.display = 'block';
        
        setTimeout(() => {
            notification.style.display = 'none';
        }, 3000);
    }
</script>
</body>
</html>
