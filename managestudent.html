<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students</title>
  <link rel="stylesheet" href="managestudent.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>

<div class="topbar">
    <h1>Manage Students</h1>
</div>

<div class="container" style="margin-left: 30px;">
  <input type="text" id="searchInput" placeholder="Search by Student Name 🔍">

  <table id="studentTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Username</th>
        <th>Password</th>
        <th>Course</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      
    </tbody>
  </table>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <span class="close" id="closeEditModal">&times;</span>
    <h2>Edit Student</h2>
    <form id="editForm">
      <label>Student ID</label>
      <input type="text" id="editId" readonly>

      <label>First Name</label>
      <input type="text" id="editFirstName" required>

      <label>Last Name</label>
      <input type="text" id="editLastName" required>

      <label>Email</label>
      <input type="email" id="editEmail" required>

      <label>Username</label>
      <input type="text" id="editUsername" required>

      <label>Password</label>
      <input type="text" id="editPassword" required>

      <label>Course/Program</label>
      <input type="text" id="editProgram" required>

      <button type="submit">Update Student</button>
    </form>
  </div>
</div>

<script src="managestudent.js"></script>
</body>
</html>
