<script>
// Image Upload Functionality
const imageInput = document.getElementById("imageUpload");
const uploadedImg = document.getElementById("uploadedImg");

imageInput.addEventListener("change", function () {
    const file = this.files[0];
    if (file && file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function (e) {
            uploadedImg.src = e.target.result;
            uploadedImg.style.display = "block";
            uploadProfileImage(file);
        };
        reader.readAsDataURL(file);
    }
});

function uploadProfileImage(file) {
    const formData = new FormData();
    formData.append('profile_image', file);

    fetch('upload_profile_image.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            console.log('Profile image updated successfully');
            // Update the profile image in the UI
            document.getElementById('uploadedImg').src = data.image_path;
            showNotification('Profile image updated successfully!', 'success');
        } else {
            console.error('Failed to upload image:', data.error);
            showNotification('Failed to upload image: ' + data.error, 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showNotification('Error uploading image. Please try again.', 'error');
    });
}

// Load student data when page loads
document.addEventListener('DOMContentLoaded', function() {
    loadStudentData();
});

function loadStudentData() {
    showLoading(true);
    
    fetch('get_student_data.php')
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                populateForm(data.student);
                showNotification('Profile data loaded successfully!', 'success');
            } else {
                console.error('Failed to load student data:', data.error);
                showNotification('Failed to load profile data: ' + data.error, 'error');
            }
        })
        .catch(error => {
            console.error('Error loading student data:', error);
            showNotification('Error loading profile data. Please check your connection.', 'error');
        })
        .finally(() => {
            showLoading(false);
        });
}

function populateForm(student) {
    // Profile header
    document.getElementById('displayName').textContent = student.first_name + ' ' + student.last_name;
    document.getElementById('displayUserID').textContent = student.username;
    
    // Profile image
    if (student.profile_image && student.profile_image !== '' && student.profile_image !== null) {
        document.getElementById('uploadedImg').src = student.profile_image;
        document.getElementById('uploadedImg').style.display = 'block';
    } else {
        // Set default image if no profile image exists
        document.getElementById('uploadedImg').src = 'human.png';
        document.getElementById('uploadedImg').style.display = 'block';
    }

    // ABOUT section
    document.getElementById('Phone').value = student.mobile_number || '';
    document.getElementById('Email').value = student.email || '';
    document.getElementById('User_Name').value = student.username || '';

    // ADDRESS section
    document.getElementById('Address').value = student.address || '';
    document.getElementById('City_State').value = student.home_district || '';
    document.getElementById('Post_Code').value = student.postcode || '';

    // STUDENT DETAILS section
    document.getElementById('DOB').value = student.date_of_birth || '';
    document.getElementById('NIC').value = student.nic || '';
    document.getElementById('Program').value = student.program || '';
    document.getElementById('stdate').value = student.intake || ''; // Using intake as started date
}

// Form submission handling
document.getElementById('profileForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    
    showLoading(true);
    
    fetch('update_profile.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.text())
    .then(data => {
        // Handle the response which contains JavaScript alert
        document.body.innerHTML += data;
        showLoading(false);
    })
    .catch(error => {
        console.error('Error updating profile:', error);
        showNotification('Error updating profile. Please try again.', 'error');
        showLoading(false);
    });
});

// Utility functions
function showLoading(show) {
    const loadingElement = document.getElementById('loading') || createLoadingElement();
    loadingElement.style.display = show ? 'block' : 'none';
}

function createLoadingElement() {
    const loadingDiv = document.createElement('div');
    loadingDiv.id = 'loading';
    loadingDiv.innerHTML = `
        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999;">
            <div style="background: white; padding: 20px; border-radius: 10px; text-align: center;">
                <div>Loading...</div>
            </div>
        </div>
    `;
    document.body.appendChild(loadingDiv);
    return loadingDiv;
}

function showNotification(message, type = 'info') {
    // Remove existing notification
    const existingNotification = document.querySelector('.notification');
    if (existingNotification) {
        existingNotification.remove();
    }
    
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.innerHTML = `
        <div style="position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 5px; color: white; z-index: 10000; 
                    background: ${type === 'success' ? '#4CAF50' : type === 'error' ? '#f44336' : '#2196F3'};">
            ${message}
        </div>
    `;
    
    document.body.appendChild(notification);
    
    // Auto remove after 5 seconds
    setTimeout(() => {
        if (notification.parentNode) {
            notification.remove();
        }
    }, 5000);
}

// Make profile picture clickable
document.getElementById('profilePreview').addEventListener('click', function() {
    document.getElementById('imageUpload').click();
});

// Add some basic styling for notifications
const style = document.createElement('style');
style.textContent = `
    .notification {
        animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    
    .profile-pic {
        cursor: pointer;
        transition: transform 0.3s ease;
    }
    
    .profile-pic:hover {
        transform: scale(1.05);
    }
    
    input:read-only {
        background-color: #f5f5f5;
        cursor: not-allowed;
    }
`;
document.head.appendChild(style);
</script>
